<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8"/>
		<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
		<title>Liquidity Concept — Documentation</title>
		<style>
			:root {
			--bg:#12151c;--surface:#1a1e28;--surface2:#222738;--surface3:#2a3045;
			--border:rgba(255,255,255,0.07);--text:#e2e6f0;--text2:#8c93a8;--text3:#5c6275;
			--accent:#4f8ef7;--green:#3dcb8a;--yellow:#FFDE21;--red:#f26e6e;
			--r:12px;--rsm:8px;--shadow:0 4px 24px rgba(0,0,0,0.35);--tr:all 0.2s ease;
			}
			.light {
			--bg:#f0f2f7;--surface:#ffffff;--surface2:#eaecf4;--surface3:#e0e3ef;
			--border:rgba(0,0,0,0.07);--text:#1a1e2e;--text2:#4a5068;--text3:#9098b0;
			--yellow:#B8860B;--shadow:0 4px 24px rgba(0,0,0,0.10);
			}
			*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
			html{scroll-behavior:smooth}
			body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.65;transition:background .3s,color .3s;min-height:100vh}
			a{color:var(--accent);text-decoration:none}
			.topbar{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:56px}
			.topbar-brand{font-size:14px;font-weight:700;letter-spacing:.02em}
			.topbar-brand span{color:var(--accent)}
			.topbar-controls{display:flex;align-items:center;gap:6px}
			.icon-btn{width:36px;height:36px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:var(--tr);font-size:16px;flex-shrink:0}
			.icon-btn:hover{background:var(--surface3);color:var(--text)}
			.lang-seg{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:10px;overflow:hidden}
			.lang-opt{padding:7px 13px;font-size:12px;font-weight:600;color:var(--text3);cursor:pointer;transition:var(--tr);letter-spacing:.02em}
			.lang-opt:hover{color:var(--text2)}
			.lang-opt.active{background:var(--accent);color:#fff}
			.page{max-width:860px;margin:0 auto;padding:48px 24px 64px}
			.hero{text-align:center;padding:52px 0 36px}
			.hero h1{font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-bottom:12px}
			.hero h1 em{font-style:normal;color:var(--accent)}
			.hero p.sub{font-size:15px;color:var(--text2);max-width:480px;margin:0 auto 28px}
			.meta-row{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
			.meta-pill{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:5px 12px;font-size:12px;color:var(--text2)}
			.meta-pill strong{color:var(--text)}
			.disclaimer{background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--yellow);border-radius:var(--r);padding:18px 22px;margin:36px 0;font-size:13px;color:var(--text2);line-height:1.75}
			.disclaimer strong{color:var(--yellow);display:block;margin-bottom:5px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
			.section-label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:14px;padding-top:40px}
			.flow{display:flex;gap:0;overflow-x:auto;padding-bottom:4px;margin-bottom:6px}
			.flow-step{flex:1;min-width:120px;cursor:pointer}
			.flow-inner{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 13px;margin:0 4px;transition:var(--tr)}
			.flow-step:hover .flow-inner{background:var(--surface2);transform:translateY(-2px);box-shadow:var(--shadow)}
			.flow-step.open .flow-inner{background:var(--surface3);border-color:var(--accent)}
			.flow-num{font-size:10px;font-weight:700;color:var(--accent);letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}
			.flow-title{font-size:13px;font-weight:700;margin-bottom:3px}
			.flow-short{font-size:12px;color:var(--text2);line-height:1.5}
			.flow-detail{display:none;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rsm);padding:13px 15px;margin-top:10px;font-size:13px;color:var(--text2);line-height:1.7}
			.flow-step.open .flow-detail{display:block}
			.flow-arrow{display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:18px;flex-shrink:0;padding-bottom:2px}
			.cta-row{display:flex;justify-content:center;margin:28px 0 4px}
			.cta-btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;font-size:14px;font-weight:700;padding:12px 26px;border-radius:var(--r);transition:var(--tr);letter-spacing:.01em}
			.cta-btn:hover{opacity:.88;transform:translateY(-1px);box-shadow:0 8px 24px rgba(79,142,247,.3)}
			.cta-btn svg{width:15px;height:15px;fill:currentColor;flex-shrink:0}
			.group{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;overflow:hidden;transition:box-shadow .2s}
			.group.open{box-shadow:var(--shadow)}
			.group-header{display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer;user-select:none;transition:background .15s}
			.group-header:hover{background:var(--surface2)}
			.group-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
			.group-meta{flex:1}
			.group-name{font-size:14px;font-weight:700}
			.group-desc{font-size:12px;color:var(--text2);margin-top:2px}
			.group-chevron{color:var(--text3);font-size:11px;transition:transform .22s;flex-shrink:0}
			.group.open .group-chevron{transform:rotate(180deg)}
			.group-body{display:none;padding:10px 12px 12px}
			.group.open .group-body{display:block}
			.setting{border-radius:var(--rsm);overflow:hidden;margin-bottom:10px}
			.setting-header{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;background:var(--surface2);transition:background .15s;border-radius:var(--rsm)}
			.setting-header:hover{background:var(--surface3)}
			.setting.open .setting-header{background:var(--surface3);border-radius:var(--rsm) var(--rsm) 0 0}
			.setting-name{flex:1;font-size:13px;font-weight:600}
			.key-tag{display:inline-flex;font-size:10px;font-weight:700;background:rgba(79,142,247,.12);color:var(--accent);border:1px solid rgba(79,142,247,.22);border-radius:4px;padding:1px 7px;margin-left:7px;vertical-align:middle;letter-spacing:.02em}
			.def-pill{font-size:11px;color:var(--text3);background:var(--surface3);border-radius:5px;padding:2px 8px;white-space:nowrap;flex-shrink:0}
			.s-chevron{color:var(--text3);font-size:10px;transition:transform .18s;flex-shrink:0}
			.setting.open .s-chevron{transform:rotate(180deg)}
			.setting-body{display:none;background:var(--surface2);border-radius:0 0 var(--rsm) var(--rsm);padding:14px 16px;border-top:1px solid var(--border)}
			.setting.open .setting-body{display:block}
			.setting-desc{font-size:13px;color:var(--text2);line-height:1.75;margin-bottom:13px}
			.impact-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
			.impact-item{flex:1;min-width:90px;background:var(--surface3);border-radius:8px;padding:8px 10px}
			.impact-label{font-size:10px;color:var(--text3);letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px}
			.impact-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden}
			.impact-fill{height:100%;border-radius:2px;transition:width .4s ease}
			.c-green{background:var(--green)}.c-yellow{background:var(--yellow)}.c-red{background:var(--red)}.c-blue{background:var(--accent)}
			.range-display{display:flex;align-items:center;gap:10px;background:var(--surface3);border-radius:8px;padding:9px 13px;margin-top:10px}
			.range-tag{font-size:11px;color:var(--text3);min-width:28px}
			.range-track{flex:1;height:3px;background:var(--border);border-radius:2px;position:relative}
			.range-thumb{position:absolute;top:50%;transform:translate(-50%,-50%);width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 5px var(--accent)}
			.range-val{font-size:11px;font-weight:700;color:var(--accent);min-width:32px;text-align:right}
			.onoff-pair{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
			.onoff-card{background:var(--surface3);border-radius:8px;padding:10px 12px;border:1px solid transparent}
			.onoff-card.on{border-color:rgba(61,203,138,.28)}.onoff-card.off{border-color:var(--border)}
			.onoff-pill{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:.04em;margin-bottom:5px}
			.pip{width:6px;height:6px;border-radius:50%;flex-shrink:0}
			.pip-on{background:var(--green);box-shadow:0 0 5px var(--green)}.pip-off{background:var(--text3)}
			.onoff-card p{font-size:12px;color:var(--text2);line-height:1.55}
			.options-grid{display:flex;flex-direction:column;gap:5px;margin-top:10px}
			.option-row{display:flex;gap:10px;background:var(--surface3);border-radius:8px;padding:9px 12px;align-items:flex-start}
			.option-name{font-size:12px;font-weight:700;color:var(--text);min-width:96px;padding-top:1px;flex-shrink:0}
			.option-desc{font-size:12px;color:var(--text2);line-height:1.5}
			.rec-badge{display:inline-flex;font-size:10px;font-weight:700;background:rgba(61,203,138,.10);color:var(--green);border:1px solid rgba(61,203,138,.22);border-radius:4px;padding:1px 6px;margin-left:5px;white-space:nowrap}
			.footer{text-align:center;padding:20px 0 0;font-size:12px;color:var(--text3);border-top:1px solid var(--border);margin-top:48px}
			.footer a{color:var(--text3)}.footer a:hover{color:var(--accent)}
			@media(max-width:600px){
			.topbar{padding:0 16px}.page{padding:32px 14px 56px}
			.flow{flex-direction:column}.flow-inner{margin:0 0 5px}
			.flow-arrow{transform:rotate(90deg);margin:0 auto;height:18px}
			.onoff-pair{grid-template-columns:1fr}.meta-row{gap:8px}.hero{padding:36px 0 24px}
			}
		</style>
	</head>
	<body>
		<script>
			const CONFIG = {
			  author:       "Xennku",
			  version:      "v0.1",
			  lastEdited:   "6 May, 2026",
			  tvLink:       "https://www.tradingview.com/script/QsHevL0S-Liquidity-Concept-Xennku-PUBLIC/",
			  defaultLang:  "en",
			  defaultTheme: "dark"
			};
			
			const T = {
			  en: {
			    h1a:"Liquidity Concept", h1b:"by "+CONFIG.author,
			    sub:"A complete multi-layer liquidity delivery model for systematic trade entry detection.",
			    version:"Version", author:"Author", lastEdited:"Updated",
			    discTitle:"⚠ NOT FINANCIAL ADVICE",
			    disc:"This tool is provided strictly for educational and analytical purposes. All configurations, signals, and output generated by this script are for informational use only. Past performance shown in any backtest does not guarantee future results. Trading financial instruments carries significant risk of loss. You are solely responsible for every trading decision made with or without this tool. The author assumes no liability for any financial outcome.",
			    howTitle:"How It Works", ctaBtn:"Open on TradingView", settings:"Settings Reference",

			    steps:[

			      {num:"02",title:"Sweep",      short:"A level is taken out.",
			       detail:"When price crosses a tracked liquidity level and reverses back inside within the configured delay window, a sweep event is registered. The reversal confirmation method (close or wick) and the allowed window are both configurable. Levels that require multiple touches before qualifying are supported via Pool Count."},

			       detail:"Fair Value Gaps detected during or after the sweep window are catalogued per event. Each gap tracks its own state: alive, flipped (inverted), or dead. FVGs can be optional context, a display filter, or a hard requirement for the event to remain active."},
			      {num:"05",title:"Entry",      short:"Signal fires at the zone.",
			       detail:"Six entry models are available: Sweep, MSS, FVG, iFVG, HTF FVG, and HTF iFVG. Market orders fire immediately at confirmation. Limit orders wait for price to retrace into the zone to a configurable depth. Each model has its own compatible order types."}
			    ],
			    groups:[
			      { icon:"⚙️", name:"Master", color:"#4f8ef7",
			        desc:"Global switches that govern the entire script.",
			        settings:[

			            desc:"Master visibility toggle for all chart drawings. Turning this off hides every box, line, and label — but all signal detection, filtering, and alert generation continue running normally in the background. Use this when you want a clean chart without losing your setups.",

			          { name:"Backtest", def:"ON", highlight:false,
			            desc:"Enables the built-in strategy engine for the TradingView Strategy Tester. When active, orders are placed and managed automatically according to your Risk Management configuration. Turn this off when using the script as a pure visual indicator — no orders will be placed, but every other feature remains intact.",
			            onoff:{on:"Orders are simulated in the Strategy Tester using position sizing from the Risk settings.",off:"Pure indicator mode. No orders are placed. All visuals, signals, and alerts still work."} }
			        ]
			      },
			      { icon:"📡", name:"HTF Delivery", color:"#7c5cbf",
			        desc:"Higher timeframe FVG zones used as directional bias context and confluence filter.",
			        settings:[
			          { name:"HTF Delivery", def:"ON", highlight:true,
			            desc:"Activates the higher timeframe Fair Value Gap tracker. Zones from a broader timeframe are overlaid on the current chart and can act as a bias filter — helping avoid signals that run counter to the larger delivery context.",
			            onoff:{on:"HTF zones are tracked and displayed. They can optionally filter or require confluence for lower-timeframe setups.",off:"No HTF filtering. ERL and IRL events are evaluated purely within their own layer."} },
			          { name:"Scope", def:"Both", highlight:false,
			            desc:"Determines which liquidity layer the HTF filter applies to. External applies only to ERL events, Internal applies only to IRL events, Both applies to all events on the chart simultaneously.",
			            options:[
			              {name:"External",desc:"HTF filter applies only to ERL events."},
			              {name:"Internal",desc:"HTF filter applies only to IRL events."},
			              {name:"Both",desc:"HTF filter applies to both ERL and IRL simultaneously.",rec:true}
			            ] },
			          { name:"Period", def:"Auto", highlight:false,
			            desc:"The timeframe used to source HTF Fair Value Gaps. Leaving this blank enables auto-resolution — the script picks a logical higher timeframe based on the current chart: 1m–3m maps to 15m, 5m maps to 1H, 15m–30m maps to 4H, 1H maps to Daily, 4H–1D maps to Weekly, 1W and above maps to Monthly. Any manual value below the current chart timeframe also falls back to auto." },
			          { name:"History", def:"5", highlight:false,
			            desc:"How many HTF zones are retained per direction. When the limit is reached, the oldest zone is evicted to make room. Higher values give more context at the cost of cluttering the chart with older, potentially less relevant zones.",
			            range:{min:1,max:20,def:5} },
			          { name:"ATR Filter", def:"ON", highlight:false,
			            desc:"Filters HTF zones by size relative to ATR. Gaps that are too small are usually random micro-imbalances with no meaningful delivery; gaps that are too large are typically extreme news events that fill rapidly without clean retracement. This keeps only structurally meaningful zones.",
			            onoff:{on:"Only zones whose size falls within the ATR Min–Max range are tracked and displayed.",off:"All HTF gaps are tracked regardless of size. Includes micro-gaps and news spikes."} },
			          { name:"ATR Period", def:"14", highlight:false,
			            desc:"Lookback period for the ATR calculation on the HTF timeframe. 14 is the standard. Increase for a smoother, slower-reacting measurement; decrease for faster but noisier response.",
			            range:{min:1,max:250,def:14} },
			          { name:"ATR Min", def:"0.25", highlight:false,
			            desc:"Minimum zone size as a multiple of ATR. Zones smaller than this threshold are ignored. Typical range is 0.15–0.40 — lower values include more zones at the cost of increased noise.",
			            range:{min:0.01,max:10,def:0.25} },
			          { name:"ATR Max", def:"3.0", highlight:false,
			            desc:"Maximum zone size as a multiple of ATR. Zones larger than this are ignored. Raise this if you trade gap-and-go scenarios where large imbalances are expected to hold without deep retracement.",
			            range:{min:0.1,max:20,def:3.0} },
			          { name:"Mode", def:"Optional", highlight:true,
			            desc:"Defines how strictly HTF zone overlap is required for ERL/IRL events to qualify. In Required mode, a buy-side sweep (BSL) needs a bearish HTF zone overhead, and a sell-side sweep (SSL) needs a bullish HTF zone below. Inversion zones aligned with the sweep direction also qualify.",

			            desc:"Displays HTF inversion zones — gaps that were closed through and now act as delivery zones in the opposite direction. The original footprint and the new inverted zone are both shown.",
			            onoff:{on:"HTF inversion zones are rendered, showing both the original and inverted footprint.",off:"HTF inversion boxes are hidden. Inversion data and filtering remain active."} },
			          { name:"Midline Style", def:"Dotted", highlight:false,
			            desc:"Visual style of the midline drawn at the 50% level inside each HTF zone. This level is the consequent encroachment — the standard reference for limit order placement at the zone midpoint.",
			            options:[
			              {name:"Solid",desc:"Continuous unbroken line."},
			              {name:"Dashed",desc:"Evenly spaced dashes."},
			              {name:"Dotted",desc:"Fine dotted line. Least visually intrusive.",rec:true}
			            ] },
			          { name:"Extend", def:"10", highlight:false,
			            desc:"Number of bars HTF zone boxes project forward from their formation point. When Dynamic Extend is on, this value is applied from the current bar instead, so zones always reach toward the right edge.",
			            range:{min:0,max:250,def:10} },
			          { name:"Dynamic Extend", def:"ON", highlight:false,
			            desc:"When on, active HTF zone boxes are continuously stretched to the current bar on every tick — zones always reach the right edge of the chart. When off, boxes extend a fixed number of bars from formation and stop there.",
			            onoff:{on:"Zones stretch to the current bar continuously.",off:"Zones extend a fixed number of bars from their formation point."} },
			          { name:"Label", def:"ON", highlight:false,

			            onoff:{on:"Timeframe labels are shown inside each zone.",off:"No labels. Cleaner chart."} }
			        ]
			      },
			      { icon:"🏔️", name:"External Range Liquidity (ERL)", color:"#00e5ff",
			        desc:"Major structural swing highs and lows — the primary targets for liquidity sweeps.",
			        settings:[
			          { name:"External", def:"OFF", highlight:false,
			            desc:"Toggles visual rendering of ERL events on the chart. Turning this off hides the sweep lines, grab boxes, FVG zones, and labels — but the engine continues detecting sweeps, validating setups, and generating signals from ERL levels.",

			          { name:"Pool Count", def:"1", highlight:true,

			    {on:"Hanya hingga Max zona yang memicu entri per event, diprioritaskan oleh pengaturan Oldest.",off:"Setiap zona FVG atau iFVG yang memenuhi syarat dalam window dapat memicu entri terpisah."},
			    null,
			    {on:"Zona terlama diprioritaskan — zona terjauh dari MSS dipilih lebih dulu.",off:"Zona terbaru diprioritaskan — zona paling dekat dengan MSS (paling baru terbentuk) dipilih lebih dulu."},
			    {on:"Data entri bertahan hingga batas Historical per layer.",off:"Data entri menghilang saat event induknya dikeluarkan dari histori."}
			  ],
			  [
			    null,
			    null,null,
			    {on:"ATR × Multiplier ditambahkan melampaui referensi SL struktural, mendorong stop lebih jauh.",off:"Tidak ada buffer. SL ditempatkan tepat di titik referensi struktural."},
			    null,null,
			    {on:"Box SL dan TP digambar dan diperbarui ke depan dari bar entri.",off:"Tidak ada box SL/TP. Entri hanya ditampilkan oleh label sinyalnya."},

			    {on:"Ukuran posisi berdasarkan ekuitas saat ini. Risiko tumbuh bersama profit dan menyusut bersama kerugian.",off:"Ukuran posisi berdasarkan modal awal tetap. Risiko konsisten per trade terlepas dari performa akun."}
			  ]
			];
			
			const idOptions = [
			  [],
			  [
			    null,
			    [{name:"External",desc:"Filter HTF hanya berlaku untuk event ERL."},{name:"Internal",desc:"Filter HTF hanya berlaku untuk event IRL."},{name:"Both",desc:"Filter HTF berlaku untuk ERL dan IRL secara bersamaan.",rec:true}],
			    null,null,null,null,null,null,
			    [{name:"Optional",desc:"Zona HTF ditampilkan hanya untuk konteks. Tidak berpengaruh pada validasi sinyal."},{name:"Filter",desc:"Setup yang valid harus overlap dengan zona HTF aktif manapun. Arah zona tidak diperiksa."},{name:"Required",desc:"Paling ketat. BSL sweep memerlukan zona HTF bearish; SSL sweep memerlukan zona HTF bullish. Zona inversi yang selaras juga memenuhi syarat.",rec:true}],
			    null,null,null,
			    [{name:"Solid",desc:"Garis tak terputus yang kontinu."},{name:"Dashed",desc:"Tanda hubung dengan jarak merata."},{name:"Dotted",desc:"Garis titik halus. Paling tidak mengganggu secara visual.",rec:true}],
			    null,null,null
			  ],
			  [
			    null,null,null,
			    [{name:"1",desc:"Pivot struktural tunggal manapun langsung memenuhi syarat. Frekuensi tertinggi.",rec:true},{name:"2",desc:"Level harus disentuh minimal dua kali dalam ATR Tolerance. Memfilter fakeout single-tap."},{name:"3+",desc:"Sangat selektif. Hanya level yang ditest banyak kali yang memenuhi syarat. Frekuensi terendah, pool terkuat."}],
			    null,null,null,null,
			    [{name:"Pivot High/Low",desc:"Konfirmasi pivot simetris. Paling akurat, tetapi memperkenalkan delay 2× panjang sebelum level muncul."},{name:"Highest/Lowest",desc:"Ekstrem rolling selama N bar terakhir. Respons cepat dengan risiko repaint minor di bar yang sedang terbentuk.",rec:true},{name:"STH/STL",desc:"Short-Term High/Low. Setiap micro-swing 3-candle memenuhi syarat. Frekuensi tertinggi, noise terbanyak."},{name:"ITH/ITL",desc:"Intermediate-Term High/Low. Titik STH/STL yang melebihi tetangganya di kedua sisi. Frekuensi dan kejelasan struktural yang seimbang."},{name:"LTH/LTL",desc:"Long-Term High/Low. Hanya titik balik utama. Frekuensi terendah, signifikansi struktural tertinggi."}],
			    [{name:"Close",desc:"Bar harus close melampaui level. Memfilter spike wick-only.",rec:true},{name:"H/L",desc:"Wick apapun melampaui level memenuhi syarat. Menangkap sweep wick presisi yang umum di pasar likuid."}],
			    [{name:"Close",desc:"Bar harus close kembali ke dalam range sweep. Penolakan terkonfirmasi.",rec:true},{name:"H/L",desc:"Sentuhan apapun kembali ke dalam memenuhi syarat. Sinyal lebih awal, konfirmasi lebih rendah."}],
			    null,
			    [{name:"Close",desc:"Bar harus close melampaui level MSS. Metode konfirmasi standar.",rec:true},{name:"H/L",desc:"Sentuhan wick melampaui level dihitung. Lebih cepat tetapi menghasilkan lebih banyak false positive."}],
			    null,null,null,
			    [{name:"Optional",desc:"Semua FVG ditampilkan. Tidak berpengaruh pada validasi atau lifecycle event."},{name:"Filter",desc:"Hanya FVG directional (bias berlawanan dengan sweep) yang ditampilkan. Logika validasi tidak berubah.",rec:true},{name:"Required",desc:"Event ditolak jika tidak ada FVG directional yang terbentuk sebelum MSS delay berakhir."}],
			    null,null,
			    [{name:"Optional",desc:"Semua iFVG ditampilkan. Tidak berpengaruh pada logika sinyal.",rec:true},{name:"Filter",desc:"Hanya iFVG yang selaras secara directional yang ditampilkan."},{name:"Required",desc:"Event sweep tidak dibuat tanpa kandidat yang memenuhi syarat. Event dikeluarkan jika tidak ada inversi yang terkonfirmasi tepat waktu."}]
			  ],
			  [
			    null,null,null,null,null,null,null,null,
			    [{name:"Pivot High/Low",desc:"Konfirmasi pivot simetris. Akurat tapi tertunda."},{name:"Highest/Lowest",desc:"Ekstrem rolling. Cepat, risiko repaint minor di bar yang terbentuk.",rec:true},{name:"STH/STL",desc:"Micro-swing 3-candle. Frekuensi tertinggi."},{name:"ITH/ITL",desc:"Swing intermediate. Frekuensi dan struktur seimbang."},{name:"LTH/LTL",desc:"Hanya titik balik utama. Frekuensi terendah."}],
			    [{name:"Close",desc:"Bar harus close melampaui level.",rec:true},{name:"H/L",desc:"Sentuhan wick dihitung."}],
			    [{name:"Close",desc:"Bar harus close kembali ke dalam. Penolakan terkonfirmasi.",rec:true},{name:"H/L",desc:"Sentuhan apapun kembali ke dalam memenuhi syarat."}],
			    null,
			    [{name:"Close",desc:"Bar harus close melampaui level MSS.",rec:true},{name:"H/L",desc:"Sentuhan wick dihitung."}],
			    null,null,null,
			    [{name:"Optional",desc:"Semua FVG ditampilkan. Tidak berpengaruh pada validasi."},{name:"Filter",desc:"Hanya FVG directional yang ditampilkan.",rec:true},{name:"Required",desc:"Event ditolak jika tidak ada FVG directional yang terbentuk tepat waktu."}],
			    null,null,
			    [{name:"Optional",desc:"Semua iFVG ditampilkan. Tidak berpengaruh pada validasi.",rec:true},{name:"Filter",desc:"Hanya iFVG yang selaras secara directional yang ditampilkan."},{name:"Required",desc:"Sweep tidak dibuat tanpa kandidat yang memenuhi syarat. Dikeluarkan jika tidak ada inversi yang terkonfirmasi tepat waktu."}]
			  ],
			  [null,null,null,null,null,null],
			  [
			    null,
			    [{name:"External",desc:"Hanya event ERL yang menghasilkan sinyal."},{name:"Internal",desc:"Hanya event IRL yang menghasilkan sinyal."},{name:"Both",desc:"Kedua layer menghasilkan sinyal secara independen.",rec:true}],
			    null,null,null,null,null,null,
			    [{name:"Sweep",desc:"Sinyal muncul saat konfirmasi pembalikan sweep. Entri paling awal. Stop lebih lebar, frekuensi tertinggi. Mendukung Market dan Limit."},{name:"MSS",desc:"Sinyal muncul saat konfirmasi Market Structure Shift. Memerlukan lebih banyak konfirmasi sebelum entri. Hanya Market order."},{name:"FVG",desc:"Sinyal muncul saat harga retrace ke Fair Value Gap yang terbentuk selama window sweep. Hanya Limit order.",rec:true},{name:"iFVG",desc:"Sinyal muncul pada inversi FVG atau retestnya. Masuk di imbalance former yang kini bertindak sebagai support atau resistance. Mendukung Market dan Limit."},{name:"HTF FVG",desc:"Muncul saat harga retrace ke zona HTF Fair Value Gap. Melewati scope ERL/IRL sepenuhnya. Hanya Limit order."},{name:"HTF iFVG",desc:"Muncul pada inversi HTF FVG atau retestnya. Model entri HTF dengan konfirmasi tertinggi. Mendukung Market dan Limit."}],
			    [{name:"Market",desc:"Entri muncul langsung saat close konfirmasi. Tidak diperlukan retracement."},{name:"Limit",desc:"Entri muncul saat harga retrace ke zona hingga kedalaman yang didefinisikan Fill Ratio.",rec:true}],
			    null,null,null,
			    null,
			    null
			  ],
			  [
			    [{name:"Percentage",desc:"Jarak tetap dari entri sebagai persentase harga. Sederhana tapi tidak sadar struktur."},{name:"Auto",desc:"Sadar struktur: melampaui wick sweep untuk entri Sweep, melampaui batas zona untuk entri FVG/iFVG/HTF, melampaui range event penuh untuk entri MSS."},{name:"Sweep Level",desc:"SL melampaui level likuiditas yang di-sweep. Opsi struktural paling ketat. Risiko stop-out lebih tinggi pada price action yang berisik."},{name:"Sweep Peak/Trough",desc:"SL melampaui ekstrem wick sweep (peak high untuk SSL sweep, trough low untuk BSL sweep). Referensi struktural yang paling umum.",rec:true},{name:"Event Range Extreme",desc:"SL melampaui seluruh range event dari pivot ke MSS. Opsi terlebar. R:R terendah per trade tapi paling banyak ruang untuk harga bergerak."},{name:"Zone",desc:"SL melampaui batas zona yang memicu entri. Fallback ke Auto jika tidak ada zona yang tersedia untuk model."}],
			    null,null,null,null,null,null,null,null
			  ]
			];
			
			T.id.groups.forEach((g, gi) => {
			  g.name = idGroupMeta[gi][0];
			  g.desc = idGroupMeta[gi][1];
			  g.settings.forEach((s, si) => {
			    if (idSettingDesc[gi] && idSettingDesc[gi][si]) s.desc = idSettingDesc[gi][si];
			    if (idOnOff[gi] && idOnOff[gi][si]) s.onoff = idOnOff[gi][si];
			    if (idOptions[gi] && idOptions[gi][si]) s.options = idOptions[gi][si];
			  });
			});
			
			let currentLang  = CONFIG.defaultLang;
			let currentTheme = CONFIG.defaultTheme;
			let openGroup    = -1;
			let openSetting  = [-1,-1];
			
			function t(k){ return T[currentLang][k] ?? T.en[k]; }
			
			function buildRange(r){
			  if(!r) return '';
			  const pct = ((r.def - r.min) / (r.max - r.min) * 100).toFixed(1);
			  return `<div class="range-display">
			    <span class="range-tag">${r.min}</span>
			    <div class="range-track"><div class="range-thumb" style="left:${pct}%"></div></div>
			    <span class="range-tag" style="text-align:right">${r.max}</span>
			    <span class="range-val">${r.def}</span>
			  </div>`;
			}
			
			function buildOnOff(oo){
			  if(!oo) return '';
			  return `<div class="onoff-pair">
			    <div class="onoff-card on"><div class="onoff-pill"><span class="pip pip-on"></span>ON</div><p>${oo.on}</p></div>
			    <div class="onoff-card off"><div class="onoff-pill"><span class="pip pip-off"></span>OFF</div><p>${oo.off}</p></div>
			  </div>`;
			}
			
			function buildOptions(opts){
			  if(!opts||!opts.length) return '';
			  return `<div class="options-grid">${opts.map(o=>`
			    <div class="option-row">
			      <span class="option-name">${o.name}${o.rec?'<span class="rec-badge">Recommended</span>':''}</span>
			      <span class="option-desc">${o.desc}</span>
			    </div>`).join('')}</div>`;
			}
			
			function buildPage(){
			  const lang  = T[currentLang];
			  const steps = lang.steps;
			  const flowHtml = steps.map((s,i) => `
			    <div class="flow-step" onclick="toggleFlow(this)">
			      <div class="flow-inner">
			        <div class="flow-num">${s.num}</div>
			        <div class="flow-title">${s.title}</div>
			        <div class="flow-short">${s.short}</div>
			        <div class="flow-detail">${s.detail}</div>
			      </div>
			    </div>${i < steps.length-1 ? '<div class="flow-arrow">›</div>' : ''}`
			  ).join('');
			
			  const groupsHtml = lang.groups.map((g, gi) => {
			    const settingsHtml = g.settings.map((s, si) => `
			      <div class="setting" id="s${gi}_${si}">
			        <div class="setting-header" onclick="toggleSetting(${gi},${si})">
			          <span class="setting-name">${s.name}${s.highlight ? '<span class="key-tag">Key</span>' : ''}</span>
			          <span class="def-pill">${t('defLabel')}: ${s.def}</span>
			          <span class="s-chevron">▼</span>
			        </div>
			        <div class="setting-body">
			          <p class="setting-desc">${s.desc}</p>
			          ${buildRange(s.range)}
			          ${buildOnOff(s.onoff)}
			          ${buildOptions(s.options)}
			        </div>
			      </div>`
			    ).join('');
			    return `<div class="group" id="grp${gi}">
			      <div class="group-header" onclick="toggleGroup(${gi})">
			        <div class="group-icon" style="background:${g.color}1a">${g.icon}</div>
			        <div class="group-meta">
			          <div class="group-name">${g.name}</div>
			          <div class="group-desc">${g.desc}</div>
			        </div>
			        <span class="group-chevron">▼</span>
			      </div>
			      <div class="group-body">${settingsHtml}</div>
			    </div>`;
			  }).join('');
			
			  document.getElementById('main').innerHTML = `
			    <div class="hero">
			      <h1><em>${t('h1a')}</em><br>${t('h1b')}</h1>
			      <p class="sub">${t('sub')}</p>
			      <div class="meta-row">
			        <div class="meta-pill">${t('version')}: <strong>${CONFIG.version}</strong></div>
			        <div class="meta-pill">${t('author')}: <strong>${CONFIG.author}</strong></div>
			        <div class="meta-pill">${t('lastEdited')}: <strong>${CONFIG.lastEdited}</strong></div>
			      </div>
			    </div>
			    <div class="disclaimer">
			      <strong>${t('discTitle')}</strong>
			      ${t('disc')}
			    </div>
			    <div class="section-label">${t('howTitle')}</div>
			    <div class="flow">${flowHtml}</div>
			    <div class="cta-row">
			      <a class="cta-btn" href="${CONFIG.tvLink}" target="_blank">
			        <svg viewBox="0 0 24 24"><path d="M10 6v2H5v11h11v-5h2v7H3V6h7zm11-3v8l-3.5-3.5-6 6L10 12l6-6L12.5 2.5 20 3z"/></svg>
			        ${t('ctaBtn')}
			      </a>
			    </div>
			    <div class="section-label">${t('settings')}</div>
			    ${groupsHtml}
			    <div class="footer">
			      <a href="${CONFIG.tvLink}" target="_blank">Liquidity Concept ${CONFIG.version}</a> &nbsp;·&nbsp; ${CONFIG.author}
			    </div>`;
			}
			
			function toggleGroup(gi){
			  const el = document.getElementById('grp'+gi);
			  const closing = openGroup === gi;
			  if(openGroup >= 0){ document.getElementById('grp'+openGroup)?.classList.remove('open'); }
			  openGroup   = closing ? -1 : gi;
			  openSetting = [-1,-1];
			  if(!closing){ el.classList.add('open'); }
			}
			
			function toggleSetting(gi, si){
			  const el = document.getElementById('s'+gi+'_'+si);
			  const [og, os] = openSetting;
			  const closing  = og === gi && os === si;
			  if(og >= 0 && os >= 0){ document.getElementById('s'+og+'_'+os)?.classList.remove('open'); }
			  openSetting = closing ? [-1,-1] : [gi,si];
			  if(!closing){ el.classList.add('open'); }
			}
			
			function toggleFlow(el){
			  const wasOpen = el.classList.contains('open');
			  document.querySelectorAll('.flow-step').forEach(f => f.classList.remove('open'));
			  if(!wasOpen) el.classList.add('open');
			}
			
			function setLang(l){
			  currentLang = l;
			  document.querySelectorAll('.lang-opt').forEach(b => b.classList.toggle('active', b.dataset.lang === l));
			  buildPage();
			  openGroup   = -1;
			  openSetting = [-1,-1];
			}
			
			function setTheme(th){
			  currentTheme = th;
			  document.body.classList.toggle('light', th === 'light');
			  document.getElementById('btn-theme').textContent = th === 'dark' ? '☀' : '☾';
			}
			
			window.addEventListener('DOMContentLoaded', () => {
			  if(currentTheme === 'light') document.body.classList.add('light');
			  document.getElementById('btn-theme').textContent = currentTheme === 'dark' ? '☀' : '☾';
			  document.querySelectorAll('.lang-opt').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));
			  buildPage();
			});
		</script>
		<div class="topbar">
			<span class="topbar-brand">Liquidity <span>Concept</span></span>
			<div class="topbar-controls">
				<div class="lang-seg">
					<div class="lang-opt" data-lang="en" onclick="setLang('en')">EN</div>
					<div class="lang-opt" data-lang="id" onclick="setLang('id')">ID</div>
				</div>
				<button class="icon-btn" id="btn-theme" onclick="setTheme(currentTheme==='dark'?'light':'dark')" title="Toggle theme">☀</button>
			</div>
		</div>
		<div class="page" id="main"></div>
	</body>
</html>
